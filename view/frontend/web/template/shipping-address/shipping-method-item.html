<!--
/**
 * Magento's own shipping method row, with room for a carrier logo.
 *
 * A copy rather than a hook, because the carrier column is plain text in the
 * original and there is nowhere to put an image without replacing it. Everything
 * else here is unchanged from Magento_Checkout, so keep it that way: the only
 * addition is the img in col-carrier, and it renders for one carrier only.
 *
 * The two values it reads are plain config on the shipping component, set from
 * PHP in LayoutProcessorPlugin. Nothing here calls a method, so this row does not
 * depend on any JavaScript of ours having loaded.
 */
-->
<tr class="row"
    click="element.selectShippingMethod">
    <td class="col col-method">
        <input type="radio"
               class="radio"
               ifnot="method.error_message"
               ko-checked="element.isSelected"
               ko-value="method.carrier_code + '_' + method.method_code"
               attr="'aria-labelledby': 'label_method_' + method.method_code + '_' + method.carrier_code + ' ' + 'label_carrier_' + method.method_code + '_' + method.carrier_code,
                    'checked': element.rates().length == 1 || element.isSelected" />
    </td>
    <!-- ko ifnot: (method.error_message) -->
    <td class="col col-price">
        <!-- A delivery that costs nothing says so. A price of 0,00 reads as a
             missing value or a bug, and this module hides a method it cannot
             price rather than quoting zero, so a zero here is always deliberate.
             Only our own rates: every other carrier keeps Magento's formatting. -->
        <!-- ko if: method.carrier_code === 'pigeonexpress' && element.pigeonexpressIsFree(method) -->
        <span class="price pigeonexpress-free" text="element.pigeonexpressFreeLabel"></span>
        <!-- /ko -->
        <!-- ko ifnot: method.carrier_code === 'pigeonexpress' && element.pigeonexpressIsFree(method) -->
        <each args="element.getRegion('price')" render=""></each>
        <!-- /ko -->
    </td>
    <!-- /ko -->
    <td class="col col-method"
        attr="'id': 'label_method_' + method.method_code + '_' + method.carrier_code"
        text="method.method_title"></td>
    <td class="col col-carrier"
        attr="'id': 'label_carrier_' + method.method_code + '_' + method.carrier_code">
        <!-- ko if: method.carrier_code === 'pigeonexpress' && element.pigeonexpressLogoUrl -->
        <img class="pigeonexpress-carrier-logo"
             css="{'-on-dark': element.pigeonexpressLogoDark}"
             attr="src: element.pigeonexpressLogoUrl, alt: method.carrier_title"/>
        <!-- /ko -->
        <!-- ko ifnot: method.carrier_code === 'pigeonexpress' && element.pigeonexpressLogoUrl -->
        <span text="method.carrier_title"></span>
        <!-- /ko -->
    </td>
</tr>
<tr class="row row-error"
    if="method.error_message">
    <td class="col col-error" colspan="4">
        <div role="alert" class="message error">
            <div text="method.error_message"></div>
        </div>
        <span class="no-display">
            <input type="radio"
                   attr="'value' : method.method_code, 'id': 's_method_' + method.method_code">
        </span>
    </td>
</tr>
