        type:
          type: string
          description: City type in Bulgarian
          enum:
            - град
            - село
            - к.к.
          example: "село"
        type_en:
          type: string
          nullable: true
          description: City type in English (only if type matches known values)
          enum:
            - city
            - village
            - resort
          example: "village"
        postal_code:
          type: string
          example: "5574"
        municipality:
          type: string
          example: "Ловеч"
        municipality_en:
          type: string
          nullable: true
          example: "Lovech"
        district:
          type: string
          example: "Ловеч"
        district_en:
          type: string
          nullable: true
          example: "Lovech"
        iso_code_2:
          type: string
          nullable: true
          example: "BG"
      required:
        - id
        - name
        - type

    Street:
      type: object
      properties:
        id:
          type: integer
          example: 406805
        name:
          type: string
          example: "3-ТИ МАРТ"
        name_en:
          type: string
          nullable: true
          example: "3-TI MART"
        type:
          type: string
          description: Street type in Bulgarian
          example: "улица"
        type_en:
          type: string
          nullable: true
          description: Street type in English
          example: "Street"
        city_id:
          type: integer
          example: 2556
      required:
        - id
        - name
        - type
        - city_id

    Office:
      type: object
      properties:
        id:
          type: integer
          example: 120
        name:
          type: string
          example: "Попово (офис)"
        code:
          type: string
          example: "POP-001"
        type:
          type: string
          enum:
            - office
            - locker
          example: "office"
        address:
          type: string
          example: "Попово, 7800"
        city:
          type: object
          properties:
            id:
              type: integer
              example: 202
            name:
              type: string
              example: "Попово"
            name_en:
              type: string
              example: "Popovo"
            type:
              type: string
              description: Settlement type in Bulgarian (град, село, к.к.)
              example: "град"
            type_en:
              type: string
              nullable: true
              description: Settlement type in English (only if type matches known values)
              enum:
                - city
                - village
                - resort
              example: "city"
            postal_code:
              type: string
              example: "7800"
            municipality:
              type: string
              example: "Попово"
            municipality_en:
              type: string
              example: "Popovo"
            district:
              type: string
              example: "Търговище"
            district_en:
              type: string
              example: "Targovishte"
            iso_code_2:
              type: string
              example: "BG"
        postal_code:
          type: string
          example: "7800"
        phone:
          type: string
          nullable: true
          example: "0876017836"
        email:
          type: string
          nullable: true
          example: null
        working_hours:
          type: array
          items:
            $ref: '#/components/schemas/WorkingHours'
        latitude:
          type: number
          format: float
          nullable: true
          example: null
        longitude:
          type: number
          format: float
          nullable: true
          example: null
        max_weight:
          type: number
          format: float
          nullable: true
          description: Maximum package weight in kg (for lockers)
          example: 20
        max_dimensions:
          type: object
          nullable: true
          description: Maximum dimensions (for lockers)
          properties:
            length:
              type: integer
              example: 60
            width:
              type: integer
              example: 40
            height:
              type: integer
              example: 40
      required:
        - id
        - name
        - type
        - address
        - type

    WorkingHours:
      type: object
      properties:
        day:
          type: string
          enum:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
          example: "monday"
        open:
          type: string
          example: "09:00"
        close:
          type: string
          example: "18:00"
        is_closed:
          type: boolean
          example: false

    Package:
      type: object
      properties:
        weight:
          type: number
          format: float
          description: Weight in kg
          minimum: 0.1
          maximum: 30
          example: 1.5
        length:
          type: integer
          description: Length in cm
          minimum: 1
          maximum: 200
          example: 30
        width:
          type: integer
          description: Width in cm
          minimum: 1
          maximum: 200
          example: 20
        height:
          type: integer
          description: Height in cm
          minimum: 1
          maximum: 200
          example: 15
      required:
        - weight

    Address:
      type: object
      description: |
        Address structure for pickup or delivery.
        **Important:** Either `street_id` OR `additional_info` must be provided:
        - If `street_id` is provided: must exist in DB and belong to `city_id`
        - If `street_id` is NOT provided: `additional_info` is required (min 3 chars)
      properties:
        city_id:
          type: integer
          description: City ID from cities API
          example: 68134
        street_id:
          type: integer
          nullable: true
          description: Street ID from streets API. Must exist and belong to city_id. If not provided, additional_info is required.
          example: 12345
        street_name:
          type: string
          nullable: true
          description: Street name (alternative to street_id)
          example: "Витоша"
        street_number:
          type: string
          example: "100"
        building_number:
          type: string
          nullable: true
          example: "А"
        entrance:
          type: string
          nullable: true
          example: "1"
        floor:
          type: string
          nullable: true
          example: "3"
        apartment:
          type: string
          nullable: true
          example: "12"
        postal_code:
          type: string
          nullable: true
          example: "1000"
        neighborhood:
          type: string
          nullable: true
          maxLength: 255
          description: Neighborhood/quarter name
          example: "Лозенец"
        contact_name:
          type: string
          nullable: true
          maxLength: 255
          description: Contact person name
          example: "Иван Петров"
        contact_phone:
          type: string
          nullable: true
          description: Contact phone number
          example: "+359888123456"
        additional_info:
          type: string
          nullable: true
          minLength: 3
          maxLength: 500
          description: Additional address info. Required (min 3 chars) if street_id is not provided.
          example: "Вход от двора, код 1234"
      required:
        - city_id

    CalculateShipmentRequest:
      type: object
      properties:
        pickup_type:
          type: string
          enum:
            - address
            - office
          example: "office"
        pickup_office_id:
          type: integer
          description: Required if pickup_type is 'office'
          example: 1001
        pickup_address:
          $ref: '#/components/schemas/Address'
          description: Required if pickup_type is 'address'. Alias 'sender_address' is also accepted.
        delivery_type:
          type: string
          enum:
            - address
            - office
            - locker
          example: "address"
        delivery_office_id:
          type: integer
          description: Required if delivery_type is 'office' or 'locker'
          example: 2001
        delivery_address:
          $ref: '#/components/schemas/Address'
          description: Required if delivery_type is 'address'
        packages:
          type: array
          items:
            $ref: '#/components/schemas/Package'
          minItems: 1
        service_type:
          type: string
          enum:
            - standard
            - express
          default: standard
        who_pays:
          type: string
          enum:
            - sender
            - receiver
          default: sender
        service_codes:
          type: object
          description: |
            Additional services as object (NOT array!).
            Keys are service codes from GET /additional-services.
            Values are `true` for checkbox services or numeric for number/text services.
          additionalProperties:
            oneOf:
              - type: boolean
              - type: number
          example:
            sms_notification_receiver: true
            declared_value: 150
            cod_amount: 50.00
      required:
        - pickup_type
        - delivery_type
        - packages
        - service_type

    ShipmentCalculation:
      type: object
      properties:
        shipping_price:
          type: number
          format: float
          description: Base shipping cost
          example: 7.2
        total_service_fees:
          type: number
          format: float
          description: Total additional service fees
          example: 6.06
        total_price:
          type: number
          format: float
          description: Total cost including all fees
          example: 13.26
        service_type:
          type: string
          description: Service type (standard/express)
          example: "standard"
        currency:
          type: string
          example: "EUR"
        service_codes:
          type: array
          description: Array of selected additional service codes
          items:
            type: string
          example: ["sms_notification_receiver", "insurance_required"]

    ServiceFee:
      type: object
      properties:
        name:
          type: string
          example: "Наложен платеж"
        amount:
          type: number
          format: float
          example: 1.50

    CreateShipmentRequest:
      type: object
      properties:
        receiver_name:
          type: string
          description: Full name of recipient
          example: "Иван Петров"
        receiver_phone:
          type: string
          description: Phone number (Bulgarian format)
          example: "+359888123456"
        receiver_email:
          type: string
          format: email
          nullable: true
          example: "ivan@example.com"
        receiver_company_name:
          type: string
          nullable: true
          maxLength: 255
          description: "**NEW** Recipient company name. Optional, but if any of receiver_company_name / receiver_company_vat / receiver_company_mol / receiver_company_address is provided, all four become required."
          example: "Акме ООД"
        receiver_company_vat:
          type: string
          nullable: true
          maxLength: 50
          description: "**NEW** Recipient company VAT / Bulstat (EIK). Required together with the other company fields (see receiver_company_name)."
          example: "BG123456789"
        receiver_company_mol:
          type: string
          nullable: true
          maxLength: 255
          description: "**NEW** Recipient company MOL (responsible person). Required together with the other company fields (see receiver_company_name)."
          example: "Иван Петров"
        receiver_company_address:
          type: string
          nullable: true
          maxLength: 255
          description: "**NEW** Recipient company address. Required together with the other company fields (see receiver_company_name)."
          example: "гр. София, ул. Витоша 1"
        receiver_company_dds_number:
          type: string
          nullable: true
          maxLength: 50
          description: "**NEW** Recipient company VAT registration number. Always optional, independent of the other company fields."
          example: "BG123456789"
        pickup_type:
          type: string
          enum:
            - address
            - office
          example: "office"
        pickup_office_id:
          type: integer
          description: Required if pickup_type is 'office'
          example: 1001
        pickup_address:
          $ref: '#/components/schemas/Address'
          description: Required if pickup_type is 'address'. Alias 'sender_address' is also accepted.
        delivery_type:
          type: string
          enum:
            - address
            - office
            - locker
          example: "address"
        delivery_office_id:
          type: integer
          description: Required if delivery_type is 'office' or 'locker'
          example: 2001
        delivery_address:
          $ref: '#/components/schemas/Address'
          description: Required if delivery_type is 'address'
        packages:
          type: array
          items:
            $ref: '#/components/schemas/Package'
          minItems: 1
        service_type:
          type: string
          enum:
            - standard
            - express
          default: standard
        who_pays:
          type: string
          enum:
            - sender
            - receiver
          default: sender
        return_at_my_expense:
          type: boolean
          description: Return shipment at sender's expense
          default: false
        note:
          type: string
          nullable: true
          description: Note for courier
          maxLength: 1000
          example: "Да се обади преди доставка"
        external_reference:
          type: string
          nullable: true
          description: "**NEW** External reference from the client's own system. Returned back in the tracking response."
          maxLength: 100
          example: "ORDER-12345"
        label_format:
          type: string
          nullable: true
          description: "**NEW** Requested label format generated together with the shipment. The label is returned in the response as `label_pdf` (base64, including ZPL), with `label_content_type` and `label_format` echoed back."
          enum:
            - default
            - pdf150
            - zpl300
          default: default
          example: "zpl300"
        inventory_items:
          type: array
          description: List of items in the shipment (required)
          items:
            type: object
            properties:
              description:
                type: string
                description: Item description
                maxLength: 200
                example: "Книга - Програмиране с PHP"
              quantity:
                type: integer
                description: Item quantity
                minimum: 1
                maximum: 1000000
                default: 1
                example: 2
            required:
              - description
          minItems: 1
        service_codes:
          type: object
          description: |
            Additional services as object (NOT array!).
            Keys are service codes from GET /additional-services.
            Values are `true` for checkbox services or numeric for number services.
          additionalProperties:
            oneOf:
              - type: boolean
              - type: number
          example:
            sms_notification_receiver: true
            declared_value: 150
            cod_amount: 50.00
        is_reverse:
          type: boolean
          default: false
          description: |
            **NEW** The shipment is created by its RECEIVER (the authenticated API customer) instead of by the sender.
            This feature must be enabled for your account by an administrator; otherwise the request returns 422.
            When `true`: provided `receiver_*` values are used as-is, missing ones default to the API customer's profile
            (company fields are treated as one block - either fully from the request or fully from the profile);
            the sender is described via the required `sender_name` + `sender_phone` (plus optional `sender_email`),
            mirroring the receiver fields on a normal shipment, and is matched to an existing customer
            or created automatically (same as an unknown receiver on a normal shipment);
            `sender_address`/pickup is NOT auto-filled (it belongs to the sender) - provide it explicitly;
            `delivery_address` is auto-filled from the API customer's default address when delivery_type=address and none is given.
          example: true
        sender_name:
          type: string
          nullable: true
          minLength: 3
          maxLength: 255
          description: "**NEW** Only when `is_reverse: true`, then required. Sender full name."
          example: "Иван Петров"
        sender_phone:
          type: string
          nullable: true
          description: "**NEW** Only when `is_reverse: true`, then required. Sender phone."
          example: "0888123456"
        sender_email:
          type: string
          format: email
          nullable: true
          description: "**NEW** Only when `is_reverse: true`. Sender email, optional (mirrors receiver_email)."
          example: "ivan.petrov@example.com"
        sender_company_name:
          type: string
          nullable: true
          maxLength: 255
          description: "**NEW** Only when `is_reverse: true`. Sender company name. Optional, but if any of sender_company_name / sender_company_vat / sender_company_mol / sender_company_address is provided, all four become required (mirrors the receiver company block)."
          example: "Акме ООД"
        sender_company_vat:
          type: string
          nullable: true
          maxLength: 50
          description: "**NEW** Only when `is_reverse: true`. Sender company VAT / Bulstat (EIK). When provided, the sender is matched directly by EIK. Required together with the other company fields."
          example: "BG123456789"
        sender_company_mol:
          type: string
          nullable: true
          maxLength: 255
          description: "**NEW** Only when `is_reverse: true`. Sender company MOL (responsible person). Required together with the other company fields."
          example: "Иван Петров"
        sender_company_address:
          type: string
          nullable: true
          maxLength: 255
          description: "**NEW** Only when `is_reverse: true`. Sender company address. Required together with the other company fields."
          example: "гр. София, ул. Витоша 1"
        sender_company_dds_number:
          type: string
          nullable: true
          maxLength: 50
          description: "**NEW** Only when `is_reverse: true`. Sender company VAT registration number. Always optional, independent of the other company fields."
          example: "BG123456789"
      required:
        - receiver_name
        - receiver_phone
        - pickup_type
        - delivery_type
        - packages
        - inventory_items
        - service_type
        - who_pays

    Shipment:
      type: object
      properties:
        reference_number:
          type: string
          description: Internal reference number
          example: "455791936383"
        status:
          type: string
          description: Status in Bulgarian
          example: "Регистрирана пратка"
        note:
          type: string
          nullable: true
          description: "**NEW** Note for courier (as submitted in the request)"
          example: "Моля, обадете се преди доставка"
        external_reference:
          type: string
          nullable: true
          description: "**NEW** External reference from the client's own system (as submitted in the request)"
          example: "ORDER-12345"
        packages:
          type: array
          items:
            type: object
            properties:
              tracking_number:
                type: string
                example: "455791936383-1"
              weight:
                type: string
                example: "1.500"
              dimensions:
                type: object
                properties:
                  length:
                    type: string
                    example: "25.00"
                  width:
                    type: string
                    example: "15.00"
                  height:
                    type: string
                    example: "10.00"
        created_at:
          type: string
          format: date-time
          example: "2026-02-26T17:17:15+02:00"
        label_pdf:
          type: string
          description: Base64 encoded label content (PDF, or ZPL text for zpl300 - still base64 in this response)
          example: "JVBERi0xLjcKMSAwIG9iago8PCAvVHlwZSAvQ2F0...."
        label_content_type:
          type: string
          description: "**NEW** MIME type of the returned label_pdf content"
          example: "application/pdf"
        label_format:
          type: string
          description: "**NEW** Echo of the requested label format"
          enum:
            - default
            - pdf150
            - zpl300
          example: "default"

    TrackingResponse:
      type: object
      properties:
        reference_number:
          type: string
          example: "455791936383"
        external_reference:
          type: string
          nullable: true
          description: External reference number provided when the shipment was created
          example: null
        note:
          type: string
          nullable: true
          description: Shipment note
          example: null
        status:
          type: string
          description: Current status name (translated)
          example: "Отказана"
        status_code:
          type: string
          description: Current status code
          example: "shipment_cancelled"
        created_at:
          type: string
          format: date-time
          example: "2026-02-26T17:17:15+02:00"
        expected_delivery_date:
          type: string
          format: date-time
          nullable: true
          example: "2026-02-27T00:00:00+02:00"
        delivery_date:
          type: string
          format: date-time
          nullable: true
          example: null
        packages:
          type: array
          items:
            $ref: '#/components/schemas/TrackingPackage'
        tracking:
          type: array
          items:
            $ref: '#/components/schemas/TrackingEvent'
        chain_before:
          type: array
          description: Linked shipments created before this one in the chain (e.g. the original shipment of a return). Empty when none.
          items:
            $ref: '#/components/schemas/ChainShipment'
        chain_after:
          type: array
          description: Linked shipments created after this one in the chain (e.g. a return-to-sender shipment). Empty when none.
          items:
            $ref: '#/components/schemas/ChainShipment'

    ChainShipment:
      type: object
      properties:
        reference_number:
          type: string
          example: "457341228749"
        external_reference:
          type: string
          nullable: true
          description: External reference number of the linked shipment
          example: null
        status:
          type: string
          description: Status name (translated)
          example: "Непотърсена"
        status_code:
          type: string
          example: "shipment_untracked"
        created_at:
          type: string
          format: date-time
          example: "2026-05-27T10:04:57+03:00"
        delivery_date:
          type: string
          format: date-time
          nullable: true
          example: null
        packages:
          type: array
          description: Packages of the linked shipment, same structure as the root-level packages
          items:
            $ref: '#/components/schemas/TrackingPackage'

    TrackingPackage:
      type: object
      properties:
        tracking_number:
          type: string
          description: The package barcode
          example: "455791936383-1"
        weight:
          type: string
          example: "1.500"

    TrackingEvent:
      type: object
      properties:
        status:
          type: string
          description: Status name (translated)
          example: "Регистрирана пратка"
        status_code:
          type: string
          description: Status code
          example: "shipment_registered"
        note:
          type: string
          nullable: true
          example: "Първоначален статус при създаване на пратката"
        created_at:
          type: string
          format: date-time
          example: "2026-02-26T17:17:15+02:00"

    ShipmentStatus:
      type: object
      description: |
        Shipment status definition.
        Only active statuses from category 'shipments' are returned.
      properties:
        code:
          type: string
          description: Unique status code
          example: "shipment_registered"
        name:
          type: string
          description: Translated status name
          example: "Регистрирана пратка"
      required:
        - code
        - name

    AdditionalService:
      type: object
      description: |
        Additional service definition.
        Only active, visible, and global services are returned.

        **Usage in service_codes:**
        - For `input_type: "checkbox"`: use `{"code": true}`
        - For `input_type: "text"`: use `{"code": value}` (e.g., `{"declared_value": 500}`)
        - For `input_type: "select"`: use `{"code": true}` (only one from option_group can be selected)
      properties:
        code:
          type: string
          description: |
            Unique code to use as KEY in service_codes object.
            For services with input fields, this is the field name (e.g., "declared_value").
            For checkbox services, this is the service code (e.g., "sms_notification_receiver").
          example: "sms_notification_receiver"
        name:
          type: string
          description: Service name in Bulgarian
          example: "SMS известие на получателя"
        description:
          type: string
          description: Service description in Bulgarian
          example: "SMS известие до получателя при пристигане на пратката"
        input_type:
          type: string
          nullable: true
          description: |
            Type of input field:
            - "checkbox": use `true` as value in service_codes
            - "text": use numeric or string value in service_codes (e.g., declared_value)
            - "select": use `true` as value (mutually exclusive within option_group)
          enum:
            - checkbox
            - text
            - select
          example: "checkbox"
        option_group:
          type: string
          nullable: true
          description: |
            Option group name for mutually exclusive services.
            Services with the same option_group can NOT be selected together - only ONE from the group.
            Example: `shipment_review` and `shipment_test_before_payment` both have `option_group: "shipment_view"`,
            so you can use `{"shipment_review": true}` OR `{"shipment_test_before_payment": true}`, but NOT both.
          example: "shipment_view"
      required:
        - code
        - name
        - description

    CodPayment:
      type: object
      description: A single paid-out COD row in the payments list.
      properties:
        waybill:
          type: string
          description: |
            Shipment waybill (reference number). For RETURN/REDIRECT/STORAGE child shipments,
            this is the original shipment's reference number; otherwise the delivery shipment's reference number.
          example: "456581447803"
        external_reference:
          type: string
          description: Customer-provided external reference of the shipment (empty string if none)
          example: "ORD-10245"
        collected_date:
          type: string
          description: Date the COD was collected, formatted d-m-Y
          example: "13-04-2026"
        paid_date:
          type: string
          description: Date the COD was paid out to the customer (payout completion date), formatted d-m-Y
          example: "18-05-2026"
        amount_eur:
          type: string
          description: Paid-out amount in EUR, formatted with 2 decimals
          example: "990.00"
      required:
        - waybill
        - external_reference
        - collected_date
        - paid_date
        - amount_eur

    Pagination:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 2
        total:
          type: integer
          example: 5275
        last_page:
          type: integer
          example: 2638

    StreetsPagination:
      type: object
      properties:
        city_id:
          type: integer
          example: 2556
        city_name:
          type: string
          example: "Новаково"
        city_name_en:
          type: string
          nullable: true
          example: "Novakovo"
        city_type:
          type: string
          description: City type in Bulgarian
          example: "село"
        city_type_en:
          type: string
          nullable: true
          description: City type in English (only if type matches known values)
          example: "village"
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 2
        total:
          type: integer
          example: 58
        last_page:
          type: integer
          example: 29

    Error:
      type: object
      description: |
        Generic error response. `message` is a human-readable description in Bulgarian.
        Do NOT program against the message text — rely on the HTTP status code,
        the `success` flag and (for validation errors) the keys of the `errors` object.
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          description: Error message in Bulgarian
          example: "Пратката не е намерена"

    ValidationErrorResponse:
      type: object
      description: |
        Validation error response (HTTP 422). `errors` is keyed by field name;
        nested fields use dot notation (`delivery_address.city_id`), array items
        use indexes (`packages.0.weight`). Each value is an array of messages.

        Note: business-rule violations (e.g. blocked receiver, COD limits, no
        matching shipping rate rule) also return HTTP 422 but WITHOUT the
        `errors` object — only `success` + `message`.
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Валидацията е неуспешна"
        errors:
          type: object
          description: Field name → array of error messages (Bulgarian)
          additionalProperties:
            type: array
            items:
              type: string
          example:
            receiver_phone: ["Полето телефон на получателя е задължително."]
            packages.0.weight: ["Полето тегло е задължително."]
            delivery_address.city_id: ["Избраната стойност за град е невалидна."]

  responses:
    BadRequest:
      description: Bad request - Missing required path parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: "Референтният номер е задължителен"

    Unauthorized:
      description: |
        Unauthorized - Missing, malformed or invalid API credentials.
        Possible messages:
        - "API keys are required. Add the X-API-Key and X-API-Secret headers." (missing headers)
        - "Invalid API key format" (key must start with `pk_live_`, secret with `sk_live_`)
        - "Invalid API keys" (credentials don't match or are deactivated)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: "Invalid API keys"

    NotFound:
      description: |
        Not found - The resource doesn't exist OR the shipment does not belong
        to your customer account (the same message is returned on purpose, to
        prevent probing for foreign reference numbers).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: "Пратката не е намерена"

    ValidationError:
      description: |
        Unprocessable Entity. Two shapes are possible:
        1. Field validation failed → `message` + `errors` object keyed by field.
        2. Business-rule violation (blocked customer/receiver, COD limits,
           unknown service codes, no shipping rate rule for the given weight,
           cancel not allowed in current status, ...) → `message` only.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            fieldValidation:
              summary: Field validation failed
              value:
                success: false
                message: "Валидацията е неуспешна"
                errors:
                  receiver_phone: ["Полето телефон на получателя е задължително."]
                  packages.0.weight: ["Полето тегло е задължително."]
            businessRule:
              summary: Business-rule violation (no errors object)
              value:
                success: false
                message: "Не могат да се изпращат пратки до този получател. Получаването на нови пратки е спряно за този клиент."

    RateLimited:
      description: Too many requests (60/min standard, 10/min for labels)
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Too Many Requests"
          example:
            message: "Too Many Requests"
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            example: 60

    ServerError:
      description: Server error - The operation was NOT performed (transactions are rolled back)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: "Създаването на пратка е неуспешно"

