openapi: 3.0.3
info:
  title: Pigeon Express API
  description: |
    API for Bulgarian courier service Pigeon Express.

    _Last updated: 2026-07-07_

    ## Errors
    All errors share a common JSON envelope: `{"success": false, "message": "..."}`.
    Validation errors (HTTP 422) additionally carry an `errors` object keyed by field
    name (dot notation for nested fields, e.g. `delivery_address.city_id`). Business-rule
    violations also return 422 but with `message` only. Messages are in Bulgarian and may
    change — rely on HTTP status codes and `errors` keys, not on message text.
    See the ValidationError response component and the "Errors & Validation Reference"
    section of EXTERNAL_API_DOCUMENTATION.md for the full catalogue.

    This API allows you to:
    - Search and retrieve cities, streets, and offices
    - Calculate shipping costs
    - Create shipments and get tracking information

    ## Authentication
    All requests require API Key and API Secret in headers.

    ## Access & Environments
    To obtain the base URLs for Production and Sandbox environments, as well as your API credentials (API Key and API Secret), please contact the Pigeon Express team.

    - **Email**: support@pigeonexpress.com
    - **Website**: https://pigeonexpress.com/
  version: 1.0.0
  license:
    name: Proprietary
    url: https://pigeonexpress.com/privacy

tags:
  - name: Cities
    description: City operations
  - name: Streets
    description: Street operations
  - name: Offices
    description: Office and locker operations
  - name: Shipments
    description: Shipment operations
  - name: Payments
    description: COD payout operations
  - name: Courier Requests
    description: Courier pickup request operations

security:
  - ApiKeyAuth: []
    ApiSecretAuth: []

paths:
  /v1/cities:
    get:
      tags:
        - Cities
      summary: List all cities
      description: Returns paginated list of all serviced cities
      operationId: listCities
      parameters:
        - name: name
          in: query
          description: Search by city name (ILIKE)
          schema:
            type: string
        - name: postal_code
          in: query
          description: Search by postal code (prefix match)
          schema:
            type: string
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: Items per page (max 100)
          schema:
            type: integer
            default: 100
            maximum: 100
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |
            curl -X GET "{BASE_URL}/cities?page=1&per_page=100" \
              -H "X-API-Key: your-api-key" \
              -H "X-API-Secret: your-api-secret"
        - lang: PHP
          label: PHP (cURL)
          source: |
            <?php
            $curl = curl_init();
            curl_setopt_array($curl, [
                CURLOPT_URL => "{BASE_URL}/cities?page=1&per_page=50",
                CURLOPT_RETURNTRANSFER => true,
                CURLOPT_HTTPHEADER => [
                    "X-API-Key: your-api-key",
                    "X-API-Secret: your-api-secret"
                ],
            ]);
            $response = curl_exec($curl);
            $cities = json_decode($response, true);
            curl_close($curl);
        - lang: PHP
          label: PHP SDK
          source: |
            <?php
            use PigeonExpress\PigeonExpress;

            $client = new PigeonExpress($apiKey, $apiSecret);
            $cities = $client->cities()->all(['page' => 1, 'per_page' => 50]);

            foreach ($cities as $city) {
                echo $city->getName() . "\n";
            }
        - lang: Java
          label: Java
          source: |
            HttpClient client = HttpClient.newHttpClient();
            HttpRequest request = HttpRequest.newBuilder()
                .uri(URI.create("{BASE_URL}/cities?page=1&per_page=50"))
                .header("X-API-Key", "your-api-key")
                .header("X-API-Secret", "your-api-secret")
                .GET()
                .build();
            HttpResponse<String> response = client.send(request,
                HttpResponse.BodyHandlers.ofString());
            System.out.println(response.body());
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/City'
                  meta:
                    $ref: '#/components/schemas/Pagination'
              example:
                success: true
                data:
                  - id: 2459
                    name: "Абланица"
                    name_en: "Ablanitsa"
                    type: "село"
                    type_en: "village"
                    postal_code: "5574"
                    municipality: "Ловеч"
                    municipality_en: "Lovech"
                    district: "Ловеч"
                    district_en: "Lovech"
                    iso_code_2: "BG"
                  - id: 798
                    name: "Абланица"
                    name_en: "Ablanitsa"
                    type: "село"
                    type_en: "village"
                    postal_code: "4645"
                    municipality: "Велинград"
                    municipality_en: "Velingrad"
                    district: "Пазарджик"
                    district_en: "Pazardzhik"
                    iso_code_2: "BG"
                meta:
                  current_page: 1
                  per_page: 2
                  total: 5275
                  last_page: 2638
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/cities/{cityId}:
    get:
      tags:
        - Cities
      summary: Get city by ID
      description: |
        Returns a single city by its ID.

        Only active cities are returned.
      operationId: getCity
      parameters:
        - name: cityId
          in: path
          description: City ID
          required: true
          schema:
            type: integer
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |
            curl -X GET "{BASE_URL}/cities/68134" \
              -H "X-API-Key: your-api-key" \
              -H "X-API-Secret: your-api-secret"
        - lang: PHP
          label: PHP (cURL)
          source: |
            <?php
            $cityId = 68134;
            $curl = curl_init();
            curl_setopt_array($curl, [
                CURLOPT_URL => "{BASE_URL}/cities/{$cityId}",
                CURLOPT_RETURNTRANSFER => true,
                CURLOPT_HTTPHEADER => [
                    "X-API-Key: your-api-key",
                    "X-API-Secret: your-api-secret"
                ],
            ]);
            $response = curl_exec($curl);
            $city = json_decode($response, true);
            curl_close($curl);
        - lang: PHP
          label: PHP SDK
          source: |
            <?php
            use PigeonExpress\PigeonExpress;

            $client = new PigeonExpress($apiKey, $apiSecret);
            $city = $client->cities()->find(68134);

            echo $city->getName();        // Sofia
            echo $city->getMunicipality(); // Stolichna
            echo $city->getPostCode();     // 1000
        - lang: Java
          label: Java
          source: |
            int cityId = 68134;
            HttpClient client = HttpClient.newHttpClient();
            HttpRequest request = HttpRequest.newBuilder()
                .uri(URI.create("{BASE_URL}/cities/" + cityId))
                .header("X-API-Key", "your-api-key")
                .header("X-API-Secret", "your-api-secret")
                .GET()
                .build();
            HttpResponse<String> response = client.send(request,
                HttpResponse.BodyHandlers.ofString());
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/City'
              example:
                success: true
                data:
                  id: 2556
                  name: "Новаково"
                  name_en: "Novakovo"
                  type: "село"
                  type_en: "village"
                  postal_code: "4262"
                  municipality: "Асеновград"
                  municipality_en: "Asenovgrad"
                  district: "Пловдив"
                  district_en: "Plovdiv"
                  iso_code_2: "BG"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/cities/{cityId}/streets:
    get:
      tags:
        - Streets
      summary: Get streets in city
      description: Returns paginated list of streets in a city
      operationId: getStreetsByCity
      parameters:
        - name: cityId
          in: path
          description: City ID
          required: true
          schema:
            type: integer
        - name: name
          in: query
          description: Search by street name (min 2 chars, supports Latin to Cyrillic transliteration)
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: Items per page (max 100)
          schema:
            type: integer
            default: 100
            maximum: 100
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |
            curl -X GET "{BASE_URL}/cities/68134/streets?page=1&per_page=100" \
              -H "X-API-Key: your-api-key" \
              -H "X-API-Secret: your-api-secret"
        - lang: PHP
          label: PHP (cURL)
          source: |
            <?php
            $cityId = 68134;
            $curl = curl_init();
            curl_setopt_array($curl, [
                CURLOPT_URL => "{BASE_URL}/cities/{$cityId}/streets?page=1&per_page=50",
                CURLOPT_RETURNTRANSFER => true,
                CURLOPT_HTTPHEADER => [
                    "X-API-Key: your-api-key",
                    "X-API-Secret: your-api-secret"
                ],
            ]);
            $response = curl_exec($curl);
            $streets = json_decode($response, true);
            curl_close($curl);
        - lang: PHP
          label: PHP SDK
          source: |
            <?php
            use PigeonExpress\PigeonExpress;

            $client = new PigeonExpress($apiKey, $apiSecret);
            $streets = $client->streets()->byCity(68134, ['page' => 1, 'per_page' => 50]);

            foreach ($streets as $street) {
                echo $street->getType() . ' ' . $street->getName() . "\n";
                // Output: Vitosha Boulevard
            }
        - lang: Java
          label: Java
          source: |
            int cityId = 68134;
            HttpClient client = HttpClient.newHttpClient();
            HttpRequest request = HttpRequest.newBuilder()
                .uri(URI.create("{BASE_URL}/cities/" + cityId + "/streets?page=1&per_page=50"))
                .header("X-API-Key", "your-api-key")
                .header("X-API-Secret", "your-api-secret")
                .GET()
                .build();
            HttpResponse<String> response = client.send(request,
                HttpResponse.BodyHandlers.ofString());
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Street'
                  meta:
                    $ref: '#/components/schemas/StreetsPagination'
              example:
                success: true
                data:
                  - id: 406805
                    name: "3-ТИ МАРТ"
                    name_en: "3-TI MART"
                    type: "улица"
                    type_en: "Street"
                    city_id: 2556
                  - id: 406790
                    name: "АЛЕН МАК"
                    name_en: "ALEN MAK"
                    type: "улица"
                    type_en: "Street"
                    city_id: 2556
                meta:
                  city_id: 2556
                  city_name: "Новаково"
                  city_name_en: "Novakovo"
                  city_type: "село"
                  city_type_en: "village"
