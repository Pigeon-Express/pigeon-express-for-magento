                      note: "Начален статус при създаване"
                      created_at: "2026-05-29T17:54:26+03:00"
                    - status: "Пренасочена"
                      status_code: "shipment_redirected"
                      note: "Статус: Пренасочена"
                      created_at: "2026-06-09T16:05:44+03:00"
                  chain_before:
                    - reference_number: "457362301385"
