  /v1/shipments/calculate:
    post:
      tags:
        - Shipments
      summary: Calculate shipping cost
      description: Calculate shipping cost based on delivery parameters
      operationId: calculateShipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateShipmentRequest'
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |
            curl -X POST "{BASE_URL}/shipments/calculate" \
              -H "X-API-Key: your-api-key" \
              -H "X-API-Secret: your-api-secret" \
              -H "Content-Type: application/json" \
              -d '{
                "pickup_type": "office",
                "pickup_office_id": 1001,
                "delivery_type": "address",
                "delivery_address": {
                  "city_id": 68134,
                  "street_id": 12345,
                  "street_number": "100"
                },
                "packages": [{"weight": 1.5, "length": 30, "width": 20, "height": 15}],
                "service_type": "standard",
                "service_codes": {
                  "cod_amount": 50.00,
                  "sms_notification_receiver": true
                }
              }'
        - lang: PHP
          label: PHP (cURL)
          source: |
            <?php
            $data = [
                'pickup_type' => 'office',
                'pickup_office_id' => 1001,
                'delivery_type' => 'address',
                'delivery_address' => [
                    'city_id' => 68134,
                    'street_id' => 12345,
                    'street_number' => '100'
                ],
                'packages' => [['weight' => 1.5, 'length' => 30, 'width' => 20, 'height' => 15]],
                'service_type' => 'standard',
                'service_codes' => [
                    'cod_amount' => 50.00,
                    'sms_notification_receiver' => true
                ]
            ];

            $curl = curl_init();
            curl_setopt_array($curl, [
                CURLOPT_URL => "{BASE_URL}/shipments/calculate",
                CURLOPT_RETURNTRANSFER => true,
                CURLOPT_POST => true,
                CURLOPT_POSTFIELDS => json_encode($data),
                CURLOPT_HTTPHEADER => [
                    "X-API-Key: your-api-key",
                    "X-API-Secret: your-api-secret",
                    "Content-Type: application/json"
                ],
            ]);
            $response = curl_exec($curl);
            $calculation = json_decode($response, true);
            curl_close($curl);
        - lang: PHP
