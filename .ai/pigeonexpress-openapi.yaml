            <?php
            $curl = curl_init();
            curl_setopt_array($curl, [
                CURLOPT_URL => "{BASE_URL}/shipments/track/bulk",
                CURLOPT_RETURNTRANSFER => true,
                CURLOPT_POST => true,
                CURLOPT_HTTPHEADER => [
