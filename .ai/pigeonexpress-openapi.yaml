  /v1/shipments/{referenceNumber}/track:
    get:
      tags:
        - Shipments
      summary: Track shipment
      description: |
        Get tracking history for a shipment.

        The response includes the package list (`packages[].tracking_number` holds
        the barcodes of the current shipment), the full status `tracking` history
        (with a `note` per event), and the linked shipments along the chain
        (`chain_before` / `chain_after`, e.g. an undelivered shipment and its
        return-to-sender shipment). Each chain entry includes its own `packages`
        array with the same structure as the root-level packages.

        For tracking many shipments at once use the
        bulk endpoint (`POST /v1/shipments/track/bulk`).

        ## Public Tracking Page (no API credentials required)

        For end-customer tracking (e.g. order confirmation emails, "Track your order" buttons,
        QR codes on labels), use the public tracking page instead of this API endpoint:

        ```
        https://track.pigeonexpress.com/?tracking_number={tracking_number}
        ```

        Example: `https://track.pigeonexpress.com/?tracking_number=1234567890`

        The public page does not require API credentials, is mobile-friendly, and auto-refreshes
        as the shipment status changes. Use this API endpoint only for programmatic processing
        in your own backend (e.g. webhooks, automation, dashboards).
      operationId: trackShipment
      externalDocs:
        description: Public tracking page (for end customers, no auth required)
        url: https://track.pigeonexpress.com/
      parameters:
        - name: referenceNumber
          in: path
          description: Shipment reference number
          required: true
          schema:
            type: string
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |
            curl -X GET "{BASE_URL}/shipments/455123456789/track" \
              -H "X-API-Key: your-api-key" \
              -H "X-API-Secret: your-api-secret"
        - lang: PHP
          label: PHP (cURL)
          source: |
            <?php
            $referenceNumber = '455123456789';
            $curl = curl_init();
            curl_setopt_array($curl, [
                CURLOPT_URL => "{BASE_URL}/shipments/{$referenceNumber}/track",
                CURLOPT_RETURNTRANSFER => true,
                CURLOPT_HTTPHEADER => [
                    "X-API-Key: your-api-key",
                    "X-API-Secret: your-api-secret"
                ],
            ]);
            $response = curl_exec($curl);
            $tracking = json_decode($response, true);
            curl_close($curl);
        - lang: PHP
          label: PHP SDK
          source: |
            <?php
            use PigeonExpress\PigeonExpress;

            $client = new PigeonExpress($apiKey, $apiSecret);
            $tracking = $client->shipments()->track('455123456789');

            echo "Current status: " . $tracking->getCurrentStatus() . "\n";
            echo "Tracking number: " . $tracking->getTrackingNumber() . "\n\n";

            echo "History:\n";
            foreach ($tracking->getEvents() as $event) {
                echo $event->getTimestamp() . " - " . $event->getDescription() . "\n";
                if ($event->getLocation()) {
                    echo "  Location: " . $event->getLocation() . "\n";
                }
            }
        - lang: Java
          label: Java
          source: |
            String referenceNumber = "455123456789";
            HttpClient client = HttpClient.newHttpClient();
            HttpRequest request = HttpRequest.newBuilder()
                .uri(URI.create("{BASE_URL}/shipments/" + referenceNumber + "/track"))
                .header("X-API-Key", "your-api-key")
                .header("X-API-Secret", "your-api-secret")
                .GET()
                .build();
            HttpResponse<String> response = client.send(request,
                HttpResponse.BodyHandlers.ofString());
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/TrackingResponse'
              example:
                success: true
                data:
                  reference_number: "457381422479"
                  external_reference: null
                  note: "Пренасочена към пратка 457570198033"
                  status: "Пренасочена"
                  status_code: "shipment_redirected"
