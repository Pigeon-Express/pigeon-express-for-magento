  /v1/shipments/track/bulk:
    post:
      tags:
        - Shipments
      summary: Bulk track shipments
      description: |
        Track up to 100 shipments in a single request.

        Results are keyed by reference number. Each entry has a `found` flag:
        found shipments return a status summary (reference_number, status,
        status_code, created_at, expected_delivery_date, delivery_date), the
        `tracking` status history, and the linked shipments in the chain
        (`chain_before` / `chain_after`) — without the root-level `packages`
        array, and the `tracking` events omit the `note` field; unknown or
        unowned references return `found: false` with an `error` message.

        `chain_before` and `chain_after` list shipments linked to the current one
        along the chain (e.g. an undelivered shipment and its return-to-sender
        shipment), created before and after it respectively. Each is an empty
        array when there are no linked shipments. Chain entries do include their
        own `packages` array (same structure as the single-track packages).

        The HTTP status is always `200` on a successful request — per-shipment
        outcomes are expressed via `found` (partial success).
      operationId: bulkTrackShipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - references
              properties:
                references:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: Reference numbers to track. Duplicates are ignored.
                  items:
                    type: string
                    maxLength: 50
            example:
              references:
                - "457341228749"
                - "457341228750"
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |
            curl -X POST "{BASE_URL}/shipments/track/bulk" \
              -H "X-API-Key: your-api-key" \
              -H "X-API-Secret: your-api-secret" \
              -H "Content-Type: application/json" \
              -d '{"references": ["457341228749", "457341228750"]}'
