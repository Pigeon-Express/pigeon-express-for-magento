  /v1/offices:
    get:
      tags:
        - Offices
      summary: List and search offices
      description: |
        Returns list of offices and lockers with optional filtering.
        Use query parameters to filter by type, city, name, or postal code.
      operationId: listOffices
      parameters:
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: Items per page (max 100)
          schema:
            type: integer
            default: 100
            maximum: 100
        - name: type
          in: query
          description: Filter by office type
          schema:
            type: string
            enum:
              - office
              - locker
        - name: name
          in: query
          description: Search by office name (case-insensitive)
          schema:
            type: string
        - name: city_id
          in: query
          description: Filter by city ID
          schema:
            type: integer
        - name: postal_code
          in: query
          description: Filter by postal code (prefix search)
          schema:
            type: string
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |
            # List all offices
            curl -X GET "{BASE_URL}/offices" \
              -H "X-API-Key: your-api-key" \
              -H "X-API-Secret: your-api-secret"

            # Filter by type
            curl -X GET "{BASE_URL}/offices?type=locker" \
              -H "X-API-Key: your-api-key" \
              -H "X-API-Secret: your-api-secret"

            # Search by city
            curl -X GET "{BASE_URL}/offices?city_id=68134&type=office" \
              -H "X-API-Key: your-api-key" \
              -H "X-API-Secret: your-api-secret"
        - lang: PHP
          label: PHP (cURL)
          source: |
            <?php
            // Build query parameters
            $params = [
                'city_id' => 68134,
                'type' => 'office',
                'per_page' => 50
            ];
            $query = http_build_query($params);

            $curl = curl_init();
            curl_setopt_array($curl, [
                CURLOPT_URL => "{BASE_URL}/offices?{$query}",
                CURLOPT_RETURNTRANSFER => true,
                CURLOPT_HTTPHEADER => [
                    "X-API-Key: your-api-key",
                    "X-API-Secret: your-api-secret"
                ],
            ]);
            $response = curl_exec($curl);
            $offices = json_decode($response, true);
            curl_close($curl);
        - lang: PHP
          label: PHP SDK
          source: |
            <?php
            use PigeonExpress\PigeonExpress;

            $client = new PigeonExpress($apiKey, $apiSecret);

            // Get all offices
            $offices = $client->offices()->all();

            // Filter by type
            $lockers = $client->offices()->all(['type' => 'locker']);

            // Search in specific city
            $sofiaOffices = $client->offices()->all([
                'city_id' => 68134,
                'type' => 'office'
            ]);

            foreach ($offices as $office) {
                echo $office->getName() . ' - ' . $office->getAddress() . "\n";
            }
        - lang: Java
          label: Java
          source: |
            HttpClient client = HttpClient.newHttpClient();
            HttpRequest request = HttpRequest.newBuilder()
                .uri(URI.create("{BASE_URL}/offices?city_id=68134&type=office"))
                .header("X-API-Key", "your-api-key")
                .header("X-API-Secret", "your-api-secret")
                .GET()
                .build();
            HttpResponse<String> response = client.send(request,
                HttpResponse.BodyHandlers.ofString());
      responses:
