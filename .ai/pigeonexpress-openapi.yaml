          label: cURL
          source: |
            curl -X POST "{BASE_URL}/courier-requests/CR-458106744669/cancel" \
              -H "X-API-Key: your-api-key" \
              -H "X-API-Secret: your-api-secret"
      responses:
        '200':
          description: Courier request cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/CourierRequest'
              example:
                success: true
                message: "Заявката е отказана успешно"
                data:
                  request_number: "CR-458106744669"
                  status:
                    code: "courier_request_cancelled"
                    name: "Отменена заявка"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key provided by Pigeon Express
    ApiSecretAuth:
      type: apiKey
      in: header
      name: X-API-Secret
      description: API Secret provided by Pigeon Express

  schemas:
    CourierRequest:
      type: object
      properties:
        request_number:
          type: string
          description: Unique identifier of the courier request.
          example: "CR-458106744669"
        request_type:
          type: string
          nullable: true
          description: Type of the courier request.
          example: single
        status:
          type: object
          nullable: true
          description: |
            Current status of the courier request.
            Codes: courier_request_pending, courier_request_assigned,
            courier_request_in_progress, courier_request_completed,
            courier_request_cancelled, courier_request_failed,
            courier_request_no_zone_courier
          properties:
            code:
              type: string
              description: Machine-readable status code.
              example: courier_request_pending
            name:
              type: string
              description: Human-readable status name (returned in Bulgarian).
              example: "Нова заявка"
        contact:
          type: object
          description: Contact person for the pickup.
          properties:
            name:
              type: string
              nullable: true
              description: Contact person name.
            phone:
              type: string
              nullable: true
              description: Contact phone number.
            email:
              type: string
              nullable: true
              description: Contact email address.
        company_name:
          type: string
          nullable: true
          description: Company name associated with the pickup.
        pickup:
          type: object
          description: Pickup address details.
          properties:
            city:
              type: string
              nullable: true
              description: Pickup city name.
            address:
              type: string
              nullable: true
              description: Pickup street and number.
            neighborhood:
              type: string
              nullable: true
              description: Pickup neighborhood / quarter.
            building_number:
              type: string
              nullable: true
              description: Building / block number.
            additional_info:
              type: string
              nullable: true
              description: Additional information to help locate the address.
        requested_pickup_date:
          type: string
          format: date
          description: Requested pickup date.
          example: "2026-07-13"
        requested_pickup_time_type:
          type: string
          enum: [interval, specific_time]
          description: "Type of the requested pickup time: `interval` for a range or `specific_time` for a single moment."
        requested_pickup_time_from:
          type: string
          description: Start of the pickup time (or the exact time when the type is `specific_time`).
          example: "09:00"
        requested_pickup_time_to:
          type: string
          nullable: true
          description: End of the pickup time range (null when the type is `specific_time`).
          example: "13:00"
        package:
          type: object
          description: Details about the package to be picked up.
          properties:
            type:
              type: string
              nullable: true
              description: Type of the package.
            description:
              type: string
              nullable: true
              description: Description of the package contents.
            estimated_weight:
              type: number
              nullable: true
              description: Estimated total weight in kilograms.
            estimated_dimensions:
              type: object
              nullable: true
              description: Estimated package dimensions in centimeters.
              properties:
                length:
                  type: number
                  description: Estimated length in centimeters.
                width:
                  type: number
                  description: Estimated width in centimeters.
                height:
                  type: number
                  description: Estimated height in centimeters.
        special_instructions:
          type: string
          nullable: true
          description: Special instructions for the courier.
        notes:
          type: string
          nullable: true
          description: Internal notes attached to the request.
        created_shipment_reference:
          type: string
          nullable: true
          description: Reference of the shipment created from this courier request, once one exists.
        created_at:
          type: string
          description: Timestamp when the courier request was created.
          example: "2026-07-10 17:17:57"

    City:
