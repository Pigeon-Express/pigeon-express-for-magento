  /v1/payments/completed:
    get:
      tags:
        - Payments
      summary: "List paid-out COD payments"
      description: |
        Returns the authenticated customer's already paid-out cash-on-delivery (COD) amounts for a date range as JSON.

        Only payouts with status `completed` are returned, filtered by the payout completion date (`completed_at`), not the shipment delivery date.

        **Date range constraints:**
        - `from_date` and `to_date` are required and must be in `YYYY-MM-DD` format.
        - `to_date` must be greater than or equal to `from_date`.
        - The range must not exceed one calendar month.

        Amounts are returned in EUR with 2 decimals (`amount_eur`). Dates (`collected_date`, `paid_date`) are formatted as `d-m-Y`.
      operationId: listPayments
      parameters:
        - name: from_date
          in: query
          required: true
          description: Start of the payout date range (inclusive), format YYYY-MM-DD
          schema:
            type: string
            format: date
            example: "2026-05-18"
        - name: to_date
          in: query
          required: true
          description: End of the payout date range (inclusive), format YYYY-MM-DD. Must be >= from_date and at most one month after it.
          schema:
            type: string
            format: date
            example: "2026-06-18"
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |
            curl -X GET "{BASE_URL}/payments/completed?from_date=2026-05-18&to_date=2026-06-18" \
              -H "X-API-Key: your-api-key" \
              -H "X-API-Secret: your-api-secret"
        - lang: PHP
          label: PHP (cURL)
          source: |
            <?php
            $curl = curl_init();
            curl_setopt_array($curl, [
                CURLOPT_URL => "{BASE_URL}/payments/completed?from_date=2026-05-18&to_date=2026-06-18",
                CURLOPT_RETURNTRANSFER => true,
                CURLOPT_HTTPHEADER => [
                    "X-API-Key: your-api-key",
                    "X-API-Secret: your-api-secret"
                ],
            ]);
            $response = curl_exec($curl);
            $payments = json_decode($response, true);
            curl_close($curl);
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Плащанията са заредени успешно"
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                        description: Number of returned rows
                        example: 2
                      rows:
                        type: array
                        items:
                          $ref: '#/components/schemas/CodPayment'
              example:
                success: true
                message: "Плащанията са заредени успешно"
                data:
                  count: 2
                  rows:
                    - waybill: "456581447803"
                      external_reference: ""
                      collected_date: "13-04-2026"
                      paid_date: "18-05-2026"
                      amount_eur: "990.00"
                    - waybill: "456742173301"
                      external_reference: "ORD-10245"
                      collected_date: "22-04-2026"
                      paid_date: "18-05-2026"
                      amount_eur: "10.00"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/courier-requests:
    post:
      tags:
        - Courier Requests
      summary: Create courier pickup request
      description: |
        Request a courier pickup from an address. The request is forwarded to the
        Pigeon Express backoffice for dispatching.

        **Notes:**
        - Identical requests within 30 seconds are deduplicated
        - `requested_pickup_date` must be an open working day, today or later, and before the daily pickup cutoff
        - Pickup times must be within office working hours
        - `requested_pickup_time_to` is required when `requested_pickup_time_type` is `interval`
        - `contact_name`, `contact_phone` and `contact_email` default to the customer profile when omitted
        - Do not include the street number in `pickup_address` when `pickup_street_number` is provided
      operationId: createCourierRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pickup_city_id
                - pickup_address
                - requested_pickup_date
                - requested_pickup_time_type
                - requested_pickup_time_from
              properties:
                pickup_city_id:
                  type: integer
                  description: Required. ID of the pickup city (see GET /v1/cities).
                  example: 1
                pickup_address:
                  type: string
                  maxLength: 255
                  description: Required. Street name for the pickup. Do not include the street number here when `pickup_street_number` is provided.
                  example: "ул. Витоша"
                pickup_street_number:
                  type: string
                  maxLength: 20
                  description: Street number for the pickup address.
                  example: "15"
                pickup_neighborhood:
                  type: string
                  maxLength: 255
                  description: Neighborhood / quarter of the pickup address.
                pickup_building_number:
                  type: string
                  maxLength: 255
                  description: Building / block number.
                pickup_entrance:
                  type: string
                  maxLength: 20
                  description: Building entrance.
                pickup_floor:
                  type: string
                  maxLength: 20
                  description: Floor number.
                pickup_apartment:
                  type: string
                  maxLength: 20
                  description: Apartment number.
                pickup_additional_info:
                  type: string
                  description: Free-text additional information to help the courier locate the address.
                requested_pickup_date:
                  type: string
                  format: date
                  description: Required. Requested pickup date. Must be an open working day, today or later, and before the daily pickup cutoff.
                  example: "2026-07-13"
                requested_pickup_time_type:
                  type: string
                  enum: [interval, specific_time]
                  description: "Required. Type of requested pickup time: `interval` for a time range or `specific_time` for a single moment."
                  example: "interval"
                requested_pickup_time_from:
                  type: string
                  description: Required. Start of the pickup time (or the exact time when `requested_pickup_time_type` is `specific_time`). Must be within office working hours.
                  example: "09:00"
                requested_pickup_time_to:
                  type: string
                  description: End of the pickup time range. Required when `requested_pickup_time_type` is `interval`. Must be within office working hours.
                  example: "13:00"
                contact_name:
                  type: string
                  maxLength: 255
                  description: Contact person for the pickup. Defaults to the customer profile when omitted.
                contact_phone:
                  type: string
                  maxLength: 50
                  description: Contact phone for the pickup. Defaults to the customer profile when omitted.
                contact_phone_country_code:
                  type: string
                  maxLength: 10
                  description: Country code for the contact phone. Defaults to "359".
                contact_email:
                  type: string
                  format: email
                  description: Contact email for the pickup. Defaults to the customer profile when omitted.
                company_name:
                  type: string
                  maxLength: 255
                  description: Company name for the pickup, if the request is on behalf of a company.
                request_type:
                  type: string
                  enum: [single]
                  description: Type of courier request. Currently only `single` is supported.
                package_type:
                  type: string
                  enum: [documents, standard, large, pallet, money_transfer]
                  description: Type of the package to be picked up.
                package_description:
                  type: string
                  description: Free-text description of the package contents.
                estimated_weight:
                  type: number
                  minimum: 0
                  description: Estimated total weight of the package in kilograms.
                estimated_dimensions:
                  type: object
                  description: Estimated package dimensions in centimeters.
                  properties:
                    length:
                      type: number
                      description: Estimated length in centimeters.
                    width:
                      type: number
                      description: Estimated width in centimeters.
                    height:
                      type: number
                      description: Estimated height in centimeters.
                special_instructions:
                  type: string
                  description: Special instructions for the courier handling the pickup.
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |
            curl -X POST "{BASE_URL}/courier-requests" \
              -H "X-API-Key: your-api-key" \
              -H "X-API-Secret: your-api-secret" \
              -H "Content-Type: application/json" \
              -d '{
                "pickup_city_id": 1,
                "pickup_address": "ул. Витоша",
                "pickup_street_number": "15",
                "requested_pickup_date": "2026-07-13",
                "requested_pickup_time_type": "interval",
                "requested_pickup_time_from": "09:00",
                "requested_pickup_time_to": "13:00",
                "package_type": "standard",
                "estimated_weight": 3.5
              }'
      responses:
        '201':
          description: Courier request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/CourierRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServerError'

