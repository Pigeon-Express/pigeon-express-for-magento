      summary: "List additional services"
      description: |
        Returns list of all available additional services.

        **Important:** The `code` field is what you should use as KEY in the `service_codes` object when creating shipments.
        - For `input_type: "checkbox"`: use `true` as value
        - For `input_type: "text"`: use numeric/string value (e.g., `declared_value`, `cod_amount`)
        - For `input_type: "select"`: use `true` as value, but **only one service per `option_group` can be selected**

        **Option Groups (mutually exclusive):**
        Services with the same `option_group` are mutually exclusive - you can only select ONE from the group.
        Example: `shipment_review` and `shipment_test_before_payment` both have `option_group: "shipment_view"`,
        so you can use either `{"shipment_review": true}` OR `{"shipment_test_before_payment": true}`, but NOT both.
