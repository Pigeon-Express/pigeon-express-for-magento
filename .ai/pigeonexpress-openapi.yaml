  /v1/shipments/{referenceNumber}/label:
    get:
      tags:
        - Shipments
      summary: Get shipping label
      description: |
        Get shipping label as PDF. By default, the PDF is displayed inline in the browser.
        Use `?download=1` to force download instead of inline display.

        Supported label formats:
        - `default` — standard thermal PDF label, 100×90mm (returned when `format` is omitted)
        - `pdf150` — PDF label, 100×150mm
        - `zpl300` — ZPL for Zebra printers (300 DPI). Returned as `text/plain` raw ZPL string (NOT base64, NOT PDF), filename `.zpl`. Always sent as an attachment. Do not render as a PDF preview.
        - `a4` — the standard label embedded into an A4 page, optimized for printing on a regular office printer. The downloaded filename gets an `-a4.pdf` suffix.

        The `Content-Type` depends on the format: `application/pdf` for `default`/`pdf150`/`a4`, `text/plain` for `zpl300`.
      operationId: getShipmentLabel
      parameters:
        - name: referenceNumber
          in: path
          description: Shipment reference number
          required: true
          schema:
            type: string
        - name: download
          in: query
          description: |
            Force download instead of inline display.
            - `false` (default): PDF is displayed in browser (Content-Disposition: inline)
            - `true` or `1`: PDF is downloaded (Content-Disposition: attachment)
          schema:
            type: boolean
            default: false
        - name: format
          in: query
          required: false
          description: |
            Label format. Optional — omit for the standard thermal label. An absent or invalid value falls back to `default`.
            - `default`: Standard thermal PDF label, 100×90mm — same as omitting the parameter
            - `pdf150`: PDF label, 100×150mm
            - `zpl300`: ZPL for Zebra printers (300 DPI), returned as raw `text/plain` string with a `.zpl` filename
            - `a4`: Standard label embedded into an A4 page, suitable for printing on a regular office printer
          schema:
            type: string
            enum:
              - default
              - pdf150
              - zpl300
              - a4
            default: default
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |
            # View PDF label in browser (inline - default)
            curl -X GET "{BASE_URL}/shipments/455123456789/label" \
              -H "X-API-Key: your-api-key" \
              -H "X-API-Secret: your-api-secret"

            # Download PDF label (force download)
            curl -X GET "{BASE_URL}/shipments/455123456789/label?download=1" \
              -H "X-API-Key: your-api-key" \
              -H "X-API-Secret: your-api-secret" \
              --output label.pdf

            # Download A4 sized PDF label (for office printers)
            curl -X GET "{BASE_URL}/shipments/455123456789/label?format=a4&download=1" \
              -H "X-API-Key: your-api-key" \
              -H "X-API-Secret: your-api-secret" \
              --output label-a4.pdf
        - lang: PHP
          label: PHP (cURL)
          source: |
            <?php
            $referenceNumber = '455123456789';
            $download = true; // false = inline (browser view), true = download

            $url = "{BASE_URL}/shipments/{$referenceNumber}/label";
            if ($download) {
                $url .= '?download=1';
            }

            $curl = curl_init();
            curl_setopt_array($curl, [
                CURLOPT_URL => $url,
                CURLOPT_RETURNTRANSFER => true,
                CURLOPT_HTTPHEADER => [
                    "X-API-Key: your-api-key",
                    "X-API-Secret: your-api-secret"
                ],
            ]);
            $labelContent = curl_exec($curl);
            curl_close($curl);

            // Save to file
            file_put_contents("label.pdf", $labelContent);

            // Or output to browser for download
            header("Content-Type: application/pdf");
            header("Content-Disposition: attachment; filename=\"label.pdf\"");
            echo $labelContent;
        - lang: PHP
          label: PHP SDK
          source: |
            <?php
            use PigeonExpress\PigeonExpress;

            $client = new PigeonExpress($apiKey, $apiSecret);

            // Get PDF label content
            $pdfContent = $client->shipments()->getLabel('455123456789');
            file_put_contents('label.pdf', $pdfContent);

            // Stream to browser for download
            header('Content-Type: application/pdf');
            header('Content-Disposition: attachment; filename="shipping-label.pdf"');
            echo $client->shipments()->getLabel('455123456789');
        - lang: Java
          label: Java
          source: |
            String referenceNumber = "455123456789";
            boolean download = true; // false = inline, true = download

            String url = "{BASE_URL}/shipments/" + referenceNumber + "/label";
            if (download) {
                url += "?download=1";
            }

            HttpClient client = HttpClient.newHttpClient();
            HttpRequest request = HttpRequest.newBuilder()
                .uri(URI.create(url))
                .header("X-API-Key", "your-api-key")
                .header("X-API-Secret", "your-api-secret")
                .GET()
                .build();

            // Save to file
            HttpResponse<Path> response = client.send(request,
                HttpResponse.BodyHandlers.ofFile(Path.of("label.pdf")));

            System.out.println("Label saved to: " + response.body());
      responses:
        '200':
          description: Successful response
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                description: Raw ZPL string (returned when format=zpl300)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

